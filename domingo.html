<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gran Celebración - Ministerio de Alabanza Filadelfia</title>
<link rel="stylesheet" href="domingo.css">
</head>
<body>

<header class="header">
  <img src="images/logo-filadelfia.jpg" alt="Logo Ministerio">
  <div>
    <small>MINISTERIO DE ALABANZA</small>
    <h1>FILADELFIA CENTRAL</h1>
  </div>
</header>

<main class="container">

<section class="hero">
<h2>🎵 Gran Celebración</h2>
<p id="fecha">Cargando fecha...</p>
</section>

<section class="observacion" id="observacion">
<h3>📌 Observación general</h3>
<p>Cargando...</p>
</section>

<div id="contenido">
Cargando listado musical...
</div>

</main>

<script>
const URL_LISTADO="https://docs.google.com/spreadsheets/d/e/2PACX-1vTdym-CkyAemW9NWdSvNH4n8J8f3We0GXh_X03Jt8-JTVs_11tLUpCH-SQMtgeMQjaaLUremE3xBbuC/pub?gid=0&single=true&output=csv";
const URL_EVENTO="https://docs.google.com/spreadsheets/d/e/2PACX-1vTdym-CkyAemW9NWdSvNH4n8J8f3We0GXh_X03Jt8-JTVs_11tLUpCH-SQMtgeMQjaaLUremE3xBbuC/pub?gid=146984402&single=true&output=csv";

function parseCSV(text){
let rows=[],row=[],cell="",quote=false;
for(let i=0;i<text.length;i++){
let c=text[i];
if(c=='"'){if(quote&&text[i+1]=='"'){cell+='"';i++;}else quote=!quote;}
else if(c==','&&!quote){row.push(cell);cell="";}
else if((c=='\n'||c=='\r')&&!quote){if(c=='\r'&&text[i+1]=='\n')i++;row.push(cell);rows.push(row);row=[];cell="";}
else cell+=c;
}
if(cell||row.length){row.push(cell);rows.push(row);}
let headers=rows.shift().map(x=>x.trim());
return rows.filter(r=>r.length).map(r=>{let o={};headers.forEach((h,i)=>o[h]=r[i]||"");return o;});
}

async function csv(url){return parseCSV(await (await fetch(url)).text());}

async function cargar(){
let evento=(await csv(URL_EVENTO))[0];
document.getElementById("fecha").innerHTML="📅 "+(evento.Fecha||"");
document.getElementById("observacion").innerHTML="<h3>📌 Observación general</h3><p>"+(evento["Observación general"]||"")+"</p>";

let canciones=await csv(URL_LISTADO);
let grupos={};

canciones.forEach(c=>{
let s=c.Sección||"General";
if(!grupos[s])grupos[s]=[];
grupos[s].push(c);
});

let html="";
for(let s in grupos){
html+=`<section class="seccion"><h2>${s}</h2>`;
grupos[s].forEach(c=>{
html+=`
<article class="cancion">
<div>
<strong>${c.Orden}. ${c.Canción}</strong>
<p>🎹 ${c.Tonalidad}</p>
</div>
<a target="_blank" href="${c["Link PDF"]}">📄 Chart</a>
</article>`;
});
html+="</section>";
}
document.getElementById("contenido").innerHTML=html;
}
cargar();
</script>

</body>
</html>
