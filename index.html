<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministerio de Alabanza Filadelfia Central</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<header class="top">
<img src="images/logo-filadelfia.jpg" alt="Logo">
<div>
<small>MINISTERIO DE ALABANZA</small>
<h1>FILADELFIA CENTRAL</h1>
</div>
</header>

<main class="container">

<section class="hero">
<h2>Alabanza que nace del corazón</h2>
<p>Salmos 33:1</p>
</section>

<section class="cards">

<article class="card">
<h2>📖 Gran celebración</h2>
<div id="celebracion">Cargando...</div>
<a href="domingo.html">Ver listado completo →</a>
</article>

<article class="card">
<h2>🎼 Ensayo</h2>
<div id="ensayo">Cargando...</div>
<a href="ensayo.html">Ver ensayo →</a>
</article>

</section>

</main>

<script>
const URL_LISTADO="https://docs.google.com/spreadsheets/d/e/2PACX-1vTdym-CkyAemW9NWdSvNH4n8J8f3We0GXh_X03Jt8-JTVs_11tLUpCH-SQMtgeMQjaaLUremE3xBbuC/pub?gid=0&single=true&output=csv";

function parseCSV(text){
let rows=[],row=[],cell="",quote=false;
for(let i=0;i<text.length;i++){
let c=text[i];
if(c=='"'){if(quote&&text[i+1]=='"'){cell+='"';i++;}else quote=!quote;}
else if(c==','&&!quote){row.push(cell);cell="";}
else if((c=='\n'||c=='\r')&&!quote){if(c=='\r'&&text[i+1]=='\n')i++;row.push(cell);rows.push(row);row=[];cell="";}
else cell+=c;
}
if(cell||row.length){row.push(cell);rows.push(row);}
let headers=rows.shift().map(x=>x.trim());
return rows.filter(r=>r.length).map(r=>{let o={};headers.forEach((h,i)=>o[h]=r[i]||"");return o;});
}

async function cargar(){
const datos=parseCSV(await (await fetch(URL_LISTADO)).text());

function resumen(evento){
let canciones=datos.filter(x=>(x.Evento||"").toLowerCase()==evento.toLowerCase());

if(!canciones.length) return "No hay información programada.";

let html=`<p>📅 ${canciones[0].Fecha||""}</p><ol>`;
canciones.slice(0,5).forEach(c=>{
html+=`<li>${c.Canción||""}</li>`;
});
html+="</ol>";

if(canciones.length>5) html+="<small>+ más canciones...</small>";
return html;
}

document.getElementById("celebracion").innerHTML=resumen("Gran celebración");
document.getElementById("ensayo").innerHTML=resumen("Ensayo");
}

cargar();
</script>

</body>
</html>
