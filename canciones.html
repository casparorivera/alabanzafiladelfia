<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canciones de Alabanza</title>
<style>
:root{
 --azul:#1769aa;--azul-oscuro:#123d68;--azul-claro:#eef6ff;
 --borde:#d8e5ef;--texto:#18344f;--gris:#687f92;--blanco:#fff;
}
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(135deg,#f4f9fd,#edf4f8);color:var(--texto)
}
.contenedor{max-width:1050px;margin:auto;padding:28px 20px 55px}
.encabezado{
 background:#fff;border:1px solid var(--borde);border-radius:24px;
 padding:28px 32px;margin-bottom:22px;
 box-shadow:0 8px 28px rgba(18,61,104,.08)
}
.etiqueta{color:#2874b8;font-weight:700;letter-spacing:1.5px;font-size:13px}
h1{font-family:Georgia,serif;color:var(--azul-oscuro);font-size:40px;margin:8px 0}
.subtitulo{margin:0;color:var(--gris);line-height:1.5}
.estado{
 background:#fff;border:1px solid var(--borde);border-radius:16px;
 padding:14px 17px;margin-bottom:18px;color:var(--gris);font-size:14px
}
.lista{display:grid;gap:16px}
.cancion{
 background:#fff;border:1px solid var(--borde);border-radius:20px;
 padding:20px 22px;box-shadow:0 7px 22px rgba(18,61,104,.06)
}
.cabecera-cancion{display:flex;align-items:flex-start;gap:14px}
.icono{
 width:44px;height:44px;flex:0 0 44px;border-radius:50%;
 background:var(--azul-claro);display:flex;align-items:center;
 justify-content:center;font-size:22px
}
.titulo{margin:0;color:var(--azul-oscuro);font-size:21px}
.audio-wrap{margin-top:16px}
audio{width:100%;height:44px}
.controles{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px}
.controles button{
 border:1px solid var(--borde);background:#f7fafc;color:var(--texto);
 border-radius:9px;padding:7px 11px;cursor:pointer;font-weight:700
}
.controles button.activo{background:var(--azul);color:#fff;border-color:var(--azul)}
.velocidad{font-size:13px;color:var(--gris);margin-left:4px}
.estudio{
 margin-top:16px;padding:12px 14px;border-radius:12px;background:#f7fafc;
 color:var(--gris);font-size:13px
}
.estudio strong{color:var(--texto)}
.sin-canciones{text-align:center;padding:35px;color:var(--gris)}
@media(max-width:650px){h1{font-size:32px}.encabezado{padding:24px}}
</style>
</head>
<body>
<div class="contenedor">
<header class="encabezado">
  <div class="etiqueta">MINISTERIO DE ALABANZA FILADELFIA CENTRAL</div>
  <h1>🎧 Canciones de Alabanza</h1>
  <p class="subtitulo">Escucha las canciones para los montajes del ministerio de alabanza.</p>
</header>

<div id="estado" class="estado">Cargando canciones...</div>
<section id="lista" class="lista"></section>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdym-CkyAemW9NWdSvNH4n8J8f3We0GXh_X03Jt8-JTVs_11tLUpCH-SQMtgeMQjaaLUremE3xBbuC/pub?gid=14478083&single=true&output=csv';

function parseCSV(text){
  const rows=[]; let row=[], cell='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c === '"'){
      if(quoted && n === '"'){cell+='"';i++;}
      else quoted=!quoted;
    } else if(c===',' && !quoted){row.push(cell.trim());cell='';}
    else if((c==='\n'||c==='\r') && !quoted){
      if(c==='\r' && n==='\n') i++;
      row.push(cell.trim());cell='';
      if(row.some(v=>v!=='')) rows.push(row);
      row=[];
    } else cell+=c;
  }
  if(cell!=='' || row.length){row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);}
  if(!rows.length)return [];
  const headers=rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>{
    const o={};
    headers.forEach((h,i)=>o[h]=(r[i]||'').trim());
    return o;
  }).filter(o=>o.titulo || o.enlace || o.estudio);
}

function driveAudioUrl(url){
  if(!url)return '';
  // Convierte enlaces habituales de Google Drive a una URL reproducible.
  let m=url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(!m)m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m)return 'https://drive.google.com/uc?export=download&id='+m[1];
  return url;
}

function crearCancion(cancion, indice){
  const titulo=cancion.titulo || 'Canción sin título';
  const audioUrl=driveAudioUrl(cancion.enlace);
  const estudio=cancion.estudio || '';

  const article=document.createElement('article');
  article.className='cancion';
  article.innerHTML=`
    <div class="cabecera-cancion">
      <div class="icono">🎵</div>
      <div><h2 class="titulo">${escapeHtml(titulo)}</h2></div>
    </div>
    <div class="audio-wrap">
      <audio controls preload="none" src="${escapeAttr(audioUrl)}" id="audio-${indice}">
        Tu navegador no puede reproducir este audio.
      </audio>
      <div class="controles" data-audio="audio-${indice}">
        <span class="velocidad">Velocidad:</span>
        <button data-speed="0.75">0.75×</button>
        <button data-speed="1" class="activo">1×</button>
        <button data-speed="1.25">1.25×</button>
        <button data-speed="1.5">1.5×</button>
        <button data-speed="2">2×</button>
      </div>
    </div>
    <div class="estudio"><strong>🎼 Estudio:</strong> ${
      estudio ? escapeHtml(estudio) : 'Próximamente'
    }</div>
  `;

  const audio=article.querySelector('audio');
  article.querySelectorAll('[data-speed]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      audio.playbackRate=parseFloat(btn.dataset.speed);
      article.querySelectorAll('[data-speed]').forEach(b=>b.classList.remove('activo'));
      btn.classList.add('activo');
    });
  });
  return article;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[m]);
}
function escapeAttr(s){return escapeHtml(s);}

async function cargar(){
  const estado=document.getElementById('estado');
  const lista=document.getElementById('lista');
  try{
    const r=await fetch(CSV_URL,{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo consultar la base de datos.');
    const canciones=parseCSV(await r.text());
    lista.innerHTML='';
    if(!canciones.length){
      estado.textContent='No hay canciones registradas todavía.';
      lista.innerHTML='<div class="cancion sin-canciones">No hay canciones disponibles por ahora.</div>';
      return;
    }
    canciones.forEach((c,i)=>lista.appendChild(crearCancion(c,i)));
    estado.textContent=`${canciones.length} canción${canciones.length===1?'':'es'} disponible${canciones.length===1?'':'s'}.`;
  }catch(e){
    console.error(e);
    estado.textContent='No fue posible cargar las canciones. Revisa que la pestaña “canciones” esté publicada como CSV.';
    lista.innerHTML='<div class="cancion sin-canciones">La información no pudo cargarse en este momento.</div>';
  }
}
cargar();
</script>
</body>
</html>
