<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensayo - Ministerio de Alabanza Filadelfia</title>
<link rel="stylesheet" href="ensayo.css">
</head>
<body>

<header class="header">
<img src="images/logo-filadelfia.jpg" alt="Logo Ministerio">
<div>
<small>MINISTERIO DE ALABANZA</small>
<h1>FILADELFIA CENTRAL</h1>
</div>
</header>

<main class="container">

<section class="hero">
<h2>🎼 Ensayo</h2>
<p id="fecha">Cargando fecha...</p>
<p id="hora"></p>
</section>

<section class="observacion" id="observacion">
<h3>📌 Observación general</h3>
<p>Cargando...</p>
</section>

<div id="contenido">Cargando información del ensayo...</div>

</main>

<script>
const URL_ENSAYO="https://docs.google.com/spreadsheets/d/e/2PACX-1vTdym-CkyAemW9NWdSvNH4n8J8f3We0GXh_X03Jt8-JTVs_11tLUpCH-SQMtgeMQjaaLUremE3xBbuC/pub?gid=531246126&single=true&output=csv";
const URL_EVENTO="https://docs.google.com/spreadsheets/d/e/2PACX-1vTdym-CkyAemW9NWdSvNH4n8J8f3We0GXh_X03Jt8-JTVs_11tLUpCH-SQMtgeMQjaaLUremE3xBbuC/pub?gid=146984402&single=true&output=csv";

function parseCSV(text){
let rows=[],row=[],cell="",quote=false;
for(let i=0;i<text.length;i++){
let c=text[i];
if(c=='"'){if(quote&&text[i+1]=='"'){cell+='"';i++;}else quote=!quote;}
else if(c==','&&!quote){row.push(cell);cell="";}
else if((c=='\n'||c=='\r')&&!quote){if(c=='\r'&&text[i+1]=='\n')i++;row.push(cell);rows.push(row);row=[];cell="";}
else cell+=c;
}
if(cell||row.length){row.push(cell);rows.push(row);}
let headers=rows.shift().map(x=>x.trim());
return rows.filter(r=>r.length).map(r=>{let o={};headers.forEach((h,i)=>o[h]=r[i]||"");return o;});
}

function normalizar(t){
return (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
}

function mismaFecha(a,b){
return (a||"").trim()===(b||"").trim();
}

async function leer(url){
return parseCSV(await (await fetch(url)).text());
}

async function cargar(){

let canciones=await leer(URL_ENSAYO);

if(canciones.length===0){
document.getElementById("contenido").innerHTML=
`<div class="sin-info">🎼 <strong>Esta semana no hay ensayo programado.</strong></div>`;
return;
}

let primera=canciones[0];

document.getElementById("fecha").innerHTML="📅 "+(primera.Fecha||"");

if(primera["Hora de llegada"]){
document.getElementById("hora").innerHTML=
"⏰ Hora de llegada: "+primera["Hora de llegada"];
}

// Buscar observación general por Evento + Fecha
let eventos=await leer(URL_EVENTO);

let observacion=eventos.find(e=>
normalizar(e.Evento)=="ensayo" &&
mismaFecha(e.Fecha, primera.Fecha)
);

document.getElementById("observacion").innerHTML=
`<h3>📌 Observación general</h3>
<p>${observacion ? (observacion["Observación general"]||"Sin observaciones") : "Sin observaciones"}</p>`;

let html="";
html+=`<section class="seccion"><h2>🎵 Canciones de ensayo</h2>`;

canciones.forEach(c=>{
html+=`
<article class="cancion">
<div>
<strong>${c.Orden||""}. ${c.Canción||""}</strong>
<p>🎹 Tonalidad: ${c.Tonalidad||""}</p>
</div>
<a target="_blank" href="${c["Link PDF"]||"#"}">📄 Chart</a>
${c.Observaciones ?
`<div class="nota">⚠️ <strong>Observación:</strong><br>${c.Observaciones}</div>` : ""}
</article>`;
});

html+="</section>";

document.getElementById("contenido").innerHTML=html;

}

cargar();
</script>

</body>
</html>
