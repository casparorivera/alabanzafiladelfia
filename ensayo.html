<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensayo - Ministerio de Alabanza Filadelfia</title>
<link rel="stylesheet" href="ensayo.css">
</head>
<body>
<header class="header">
<img src="images/logo-filadelfia.jpg" alt="Logo Ministerio">
<div><small>MINISTERIO DE ALABANZA</small><h1>FILADELFIA CENTRAL</h1></div>
</header>
<main class="container">
<section class="hero">
<h2>🎼 Ensayo</h2>
<p id="fecha">Cargando fecha...</p>
<p id="hora"></p>
</section>
<section class="observacion" id="observacion"><h3>📌 Observación general</h3><p>Cargando...</p></section>
<div id="contenido">Cargando información del ensayo...</div>
</main>
<script>
const URL_ENSAYO="https://docs.google.com/spreadsheets/d/e/2PACX-1vTdym-CkyAemW9NWdSvNH4n8J8f3We0GXh_X03Jt8-JTVs_11tLUpCH-SQMtgeMQjaaLUremE3xBbuC/pub?gid=531246126&single=true&output=csv";

function parseCSV(t){
let r=[],a=[],c="",q=false;
for(let i=0;i<t.length;i++){
let x=t[i];
if(x=='"'){q=!q;}
else if(x==','&&!q){a.push(c);c="";}
else if((x=='
'||x=='')&&!q){if(x==''&&t[i+1]=='
')i++;a.push(c);r.push(a);a=[];c="";}
else c+=x;
}
if(c||a.length){a.push(c);r.push(a);}
let h=r.shift().map(x=>x.trim());
return r.filter(x=>x.length).map(x=>{let o={};h.forEach((k,i)=>o[k]=x[i]||"");return o;});
}
async function cargar(){
let canciones=parseCSV(await (await fetch(URL_ENSAYO)).text());
if(!canciones.length){
document.getElementById("contenido").innerHTML="🎼 Esta semana no hay ensayo programado.";
return;
}
let p=canciones[0];
document.getElementById("fecha").innerHTML="📅 "+(p.Fecha||"");
document.getElementById("hora").innerHTML=p["Hora de llegada"]?"⏰ Hora de llegada: "+p["Hora de llegada"]:"";
document.getElementById("observacion").innerHTML="<h3>📌 Observación general</h3><p>"+(p["Observación general"]||"Sin observaciones")+"</p>";
let html="<section class='seccion'><h2>🎵 Canciones de ensayo</h2>";
canciones.forEach(c=>{
html+=`<article class="cancion"><div><strong>${c.Orden||""}. ${c.Canción||""}</strong><p>🎹 Tonalidad: ${c.Tonalidad||""}</p></div><a target="_blank" href="${c["Link PDF"]||"#"}">📄 Chart</a>${c.Observaciones?`<div class="nota">⚠️ <strong>Observación:</strong><br>${c.Observaciones}</div>`:""}</article>`;
});
html+="</section>";
document.getElementById("contenido").innerHTML=html;
}
cargar();
</script>
</body>
</html>
